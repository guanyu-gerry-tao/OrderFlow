spring:
  application:
    name: orderflow-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/orderflow}
    username: ${SPRING_DATASOURCE_USERNAME:orderflow}
    password: ${SPRING_DATASOURCE_PASSWORD:orderflow}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:250ms}
      repositories:
        enabled: false
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.orderflow.events
server:
  port: ${SERVER_PORT:8080}
orderflow:
  events:
    mode: ${ORDERFLOW_EVENT_MODE:outbox-kafka}
    broker: ${ORDERFLOW_EVENT_BROKER:kafka}
    topic: ${ORDERFLOW_EVENT_TOPIC:orderflow.order-events}
    retry:
      max-attempts: ${ORDERFLOW_EVENT_RETRY_MAX_ATTEMPTS:3}
      initial-backoff: ${ORDERFLOW_EVENT_RETRY_INITIAL_BACKOFF:5s}
  idempotency:
    mode: ${ORDERFLOW_IDEMPOTENCY_MODE:strict}
    cache: ${ORDERFLOW_IDEMPOTENCY_CACHE:redis}
    cache-ttl: ${ORDERFLOW_IDEMPOTENCY_CACHE_TTL:10m}
  inventory:
    strategy: ${ORDERFLOW_INVENTORY_STRATEGY:optimistic-locking}
